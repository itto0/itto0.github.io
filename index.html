<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111b">
  <meta name="description" content="The personal website of itto0.">
  <title>itto0 — Personal site</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10111b;
      color: #f5f4fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at 18% 18%, rgb(103 80 220 / 18%), transparent 36rem),
        radial-gradient(ellipse at 85% 85%, rgb(37 162 178 / 12%), transparent 32rem),
        #10111b;
    }

    main {
      width: min(100%, 720px);
      padding: clamp(32px, 8vw, 72px);
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 28px;
      background: rgb(24 25 39 / 82%);
      box-shadow: 0 24px 90px rgb(0 0 0 / 28%);
      animation: rise-in 650ms ease-out both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 28px;
      color: #b9b5ca;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a795ff;
      content: "";
      box-shadow: 0 0 16px #a795ff;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 12vw, 6.4rem);
      line-height: 0.98;
      letter-spacing: -0.075em;
    }

    h1 span {
      color: #a795ff;
    }

    .intro {
      max-width: 42ch;
      margin: 28px 0 36px;
      color: #c4c2d0;
      font-size: clamp(1.05rem, 2.4vw, 1.2rem);
      line-height: 1.75;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 999px;
      color: #f5f4fb;
      font-size: 0.95rem;
      font-weight: 650;
      text-decoration: none;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    a:hover {
      transform: translateY(-2px);
      border-color: rgb(167 149 255 / 72%);
      background: rgb(167 149 255 / 10%);
    }

    a:focus-visible {
      outline: 3px solid #a795ff;
      outline-offset: 4px;
    }

    a.primary {
      border-color: #a795ff;
      background: #a795ff;
      color: #171326;
    }

    a.primary:hover {
      border-color: #c0b3ff;
      background: #c0b3ff;
    }

    .arrow { font-size: 1.1em; }

    footer {
      margin-top: 64px;
      color: #858394;
      font-size: 0.85rem;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Personal site</p>
    <h1>Hi, I'm <span>itto0.</span></h1>
    <p class="intro">Welcome to my corner of the web. Explore my projects and open-source work on GitHub.</p>
    <nav aria-label="Find me online">
      <a class="primary" href="https://github.com/itto0" target="_blank" rel="noopener noreferrer">
        GitHub profile <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://github.com/itto0?tab=repositories" target="_blank" rel="noopener noreferrer">
        Browse repositories <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <footer>Made with care · © <span id="year">2026</span> itto0</footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
